<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Letohry Tisá - lodě</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell kiosk-shell theme-river" data-theme="river">
      <section class="race-layout">
        <div class="kiosk-header">
          <div>
            <p class="eyebrow">Indoor Rowing Race</p>
            <h1>Letohry Tisá - lodě</h1>
          </div>
          <div class="kiosk-sidepanel">
            <div class="panel-heading">
              <p class="eyebrow">Nejrychlejší časy</p>
            </div>
            <div id="leaderboard"></div>
          </div>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
        <div class="track-frame">
          <canvas id="raceCanvas" width="1440" height="720"></canvas>
          <div class="center-overlay">
            <div class="overlay-card">
              <span id="countdown">3</span>
              <p id="eventLabel">Pripraveno</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
