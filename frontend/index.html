<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LetoHry Lode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell theme-river" data-theme="river">
      <section class="hud-panel">
        <div>
          <p class="eyebrow">Indoor Rowing Race</p>
          <h1>LetoHry Lode</h1>
        </div>
        <div class="control-grid">
          <label>
            Hrac 1
            <input id="player1" value="Veslar 1" maxlength="20" />
          </label>
          <label>
            Hrac 2
            <input id="player2" value="Veslar 2" maxlength="20" />
          </label>
          <label>
            Trat
            <select id="distance">
              <option value="500">500 m</option>
              <option value="1000" selected>1000 m</option>
              <option value="2000">2000 m</option>
            </select>
          </label>
          <label>
            Rezim
            <select id="mode">
              <option value="realtime">Realtime</option>
              <option value="ghost">Ghost</option>
              <option value="interval">Interval</option>
            </select>
          </label>
          <label>
            Ghost
            <select id="ghostSource">
              <option value="none">Bez ghosta</option>
              <option value="previous">Predchozi vykon</option>
              <option value="personal_best">Osobni rekord</option>
            </select>
          </label>
          <label>
            Tema
            <select id="theme">
              <option value="river">Reka</option>
              <option value="lake">Jezero</option>
              <option value="night">Noc</option>
            </select>
          </label>
          <label>
            Interval
            <select id="intervalPreset">
              <option value="30,30">30 s / 30 s</option>
              <option value="60,60">60 s / 60 s</option>
            </select>
          </label>
          <label class="toggle-label">
            <span>Mock PM3</span>
            <input id="useMock" type="checkbox" checked />
          </label>
        </div>
        <div class="button-row">
          <button id="startButton" class="primary">Start</button>
          <button id="resetButton">Reset</button>
        </div>
      </section>

      <section class="race-layout">
        <div class="scoreboard" id="scoreboard"></div>
        <div class="track-frame">
          <canvas id="raceCanvas" width="1440" height="720"></canvas>
          <div class="center-overlay">
            <span id="countdown">3</span>
            <p id="eventLabel">Pripraveno</p>
          </div>
        </div>
      </section>

      <section class="history-panel">
        <div>
          <div class="panel-heading">
            <p class="eyebrow">Leaderboard</p>
            <button id="exportLeaderboardCsvButton" class="secondary-action">Leaderboard CSV</button>
          </div>
          <div id="leaderboard"></div>
        </div>
        <div>
          <div class="panel-heading">
            <p class="eyebrow">Posledni jizdy</p>
            <button id="exportCsvButton" class="secondary-action">Export CSV</button>
          </div>
          <div id="history"></div>
        </div>
        <div>
          <div class="panel-heading">
            <p class="eyebrow">Diagnostika</p>
            <button id="exportDiagnosticsButton" class="secondary-action">PM3 log</button>
          </div>
          <div id="diagnostics"></div>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
